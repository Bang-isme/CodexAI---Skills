# Hardened Local & Staging Development Stack
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:3000:3000'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  postgres:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - 'pg_data:/var/lib/postgresql/data'
    environment:
      POSTGRES_DB: app_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${PG_PASSWORD:-postgres}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    command: ['sh', '-c', 'redis-server --requirepass "${REDIS_PASSWORD:-dev_redis_pass}"']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD:-dev_redis_pass}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
