# Template reference: copy into a target repo that vendors this skill pack under skills/.
# Adjust SKILLS_ROOT if the pack lives elsewhere (e.g. .agents/skills or .cursor/skills).
name: Codex Quality Gate

on: [push, pull_request]

permissions:
  contents: read

env:
  SKILLS_ROOT: skills
  PYTHONUTF8: "1"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install --upgrade pip PyYAML

      - name: Run Python contract tests
        run: python -m unittest discover -s "$SKILLS_ROOT/tests" -p "test_*.py"

      - name: Run responsive capture helper tests
        run: node --test "$SKILLS_ROOT/tests/responsive_capture_stitch.test.mjs" "$SKILLS_ROOT/tests/responsive_capture_core.test.mjs" "$SKILLS_ROOT/tests/responsive_capture_browser.test.mjs"

      - name: Quick quality gate
        run: python "$SKILLS_ROOT/codex-execution-quality-gate/scripts/auto_gate.py" --project-root . --mode quick

      - name: Security scan
        run: python "$SKILLS_ROOT/codex-execution-quality-gate/scripts/security_scan.py" --project-root .

      - name: Pre-commit check
        run: python "$SKILLS_ROOT/codex-execution-quality-gate/scripts/pre_commit_check.py" --project-root .
