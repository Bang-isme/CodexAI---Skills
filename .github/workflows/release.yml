# Plugin release pipeline.
# - Tag push v* (e.g. v18.0.0): run the local release gate, build the ZIP, publish a GitHub Release.
# - workflow_dispatch: build the ZIP as an artifact only (no GitHub Release).
# There is intentionally no deploy.yml and no staging/production environments for this repository.

name: Release Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  PYTHONUTF8: "1"

jobs:
  package:
    name: Gate, build ZIP, publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Verify tag matches skills/VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(tr -d '[:space:]' < skills/VERSION)"
          if [[ "$expected" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match skills/VERSION ($expected)"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches skills/VERSION"

      - name: Run unified pipeline (lint, contracts, test, doctor)
        run: python skills/.system/scripts/pipeline.py --stage lint,contracts,test,doctor --format text

      - name: Run local release gate and build ZIP
        run: python skills/.system/scripts/local_release_gate.py --apply --format json

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: codexai-skill-pack
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
